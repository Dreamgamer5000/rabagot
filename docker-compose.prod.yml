services:
  backend:
    image: ${GCP_REGION:-us-west1}-docker.pkg.dev/${GCP_PROJECT_ID:-your-gcp-project-id}/${GCP_REPO_NAME:-picshare-repo}/${BACKEND_CONTAINER_NAME:-picshare-backend}:${IMAGE_TAG:-latest}
    init: true
    container_name: ${BACKEND_CONTAINER_NAME:-picshare-backend}
    hostname: ${BACKEND_CONTAINER_NAME:-picshare-backend}
    restart: always
    volumes:
      - ./data:/app/data:z
      - ${LOCAL_PHOTOS_DIR:-./photos}:/photos:ro
    expose:
      - "8000"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - SYNC_CONCURRENCY=${SYNC_CONCURRENCY:-1}
    networks:
      - web_net

  frontend:
    image: ${GCP_REGION:-us-west1}-docker.pkg.dev/${GCP_PROJECT_ID:-your-gcp-project-id}/${GCP_REPO_NAME:-picshare-repo}/${FRONTEND_CONTAINER_NAME:-picshare-frontend}:${IMAGE_TAG:-latest}
    init: true
    container_name: ${FRONTEND_CONTAINER_NAME:-picshare-frontend}
    restart: always
    expose:
      - "3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
      - BACKEND_HOSTNAME=${BACKEND_HOSTNAME:-picshare-backend:8000}
    env_file:
      - .env
    networks:
      - web_net

networks:
  web_net:
    external: true
